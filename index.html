<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Restaurant Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <header class="bg-primary text-white py-3" aria-label="Main header">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="m-0">Accessible Restaurant Reviews</h1>
            <div id="auth-container"></div>
        </div>
    </header>
    <header class="bg-primary text-white py-3" aria-label="Main header">
        <div class="container">
            <h1 class="text-center">Accessible Restaurant Reviews</h1>
        </div>
    </header>

    <main class="container my-4">
        <section aria-labelledby="restaurants-heading">
            <h2 id="restaurants-heading" class="mb-4">Featured Restaurants</h2>
            <div id="restaurants-container" class="row">
                <!-- Restaurant cards will be loaded here -->
            </div>
        </section>
    </main>

    <script src="js/firebase.js" type="module"></script>
    <script src="js/app.js" type="module"></script>

</html>
