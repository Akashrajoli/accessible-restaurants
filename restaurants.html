<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white py-3" aria-label="Restaurant header">
        <div class="container">
            <h1 id="restaurant-name" class="text-center"></h1>
        </div>
    </header>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-6">
                <img id="restaurant-image" class="img-fluid rounded" alt="">
            </div>
            <div class="col-md-6">
                <div id="restaurant-details"></div>
                <button id="add-review-btn" class="btn btn-primary mt-3" aria-label="Add a review">Add Review</button>
            </div>
        </div>

        <section aria-labelledby="reviews-heading" class="mt-5">
            <h2 id="reviews-heading">Customer Reviews</h2>
            <div id="reviews-container"></div>
        </section>
    </main>

    <script src="../js/firebase.js" type="module"></script>
    <script src="../js/app.js" type="module"></script>
</body>
</html>
